version: 2
sources:
- name: bronze
  database: DE_AI_AGENT_DEV
  schema: BRONZE
  tables: []
models:
- name: stg_historical_results
  description: Silver staging model for historical results
  columns:
  - name: date
    description: Raw date from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
  - name: home_team
    description: Raw home team from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
  - name: away_team
    description: Raw away team from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
  - name: home_score
    description: Raw home score from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 0
        strictly: false
  - name: away_score
    description: Raw away score from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 0
        strictly: false
  - name: tournament
    description: Raw tournament from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
    - accepted_values:
        values:
        - British Home Championship
        - Copa América
        - Copa Lipton
        - Copa Newton
        - Copa Premio Honor Argentino
        - Copa Premio Honor Uruguayo
        - Copa Roca
        - Far Eastern Championship Games
        - Friendly
        - Muratti Vase
        - Olympic Games
        - Évence Coppée Trophy
  - name: city
    description: Raw city from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
  - name: country
    description: Raw country from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
  - name: neutral
    description: Raw neutral from Bronze RAW_HISTORICAL_RESULTS
    tests:
    - not_null
