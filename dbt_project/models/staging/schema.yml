version: 2
sources:
- name: bronze
  database: DE_AI_AGENT_DEV
  schema: BRONZE
  tables: []
models:
- name: stg_historical_results
  description: Silver staging model for historical results
  columns:
  - name: date
    description: The date of the match.
    tests:
    - not_null
  - name: home_team
    description: The name of the home team in lowercase.
    tests:
    - not_null
  - name: away_team
    description: The name of the away team in lowercase.
    tests:
    - not_null
  - name: home_score
    description: The score of the home team.
    tests:
    - not_null
  - name: away_score
    description: The score of the away team.
    tests:
    - not_null
  - name: tournament
    description: The tournament name in lowercase.
    tests:
    - not_null
  - name: city
    description: The city where the match was held, in lowercase.
    tests:
    - not_null
  - name: country
    description: The country where the match was held, in lowercase.
    tests:
    - not_null
  - name: neutral
    description: A boolean indicating if the match was played on neutral ground.
    tests:
    - not_null
  - name: _loaded_at
    description: Timestamp when this record was loaded into the staging layer.
- name: stg_historical_goals
  description: Silver staging model for historical goals
  columns:
  - name: game_date
    description: The date of the game when the goal was scored.
    tests:
    - not_null
  - name: home_team
    description: The name of the home team in the match.
    tests:
    - not_null
  - name: away_team
    description: The name of the away team in the match.
    tests:
    - not_null
  - name: team
    description: The team that scored the goal.
    tests:
    - not_null
  - name: scorer
    description: The player who scored the goal.
    meta:
      pii: true
    tests:
    - not_null
  - name: minute
    description: The minute in which the goal was scored.
    tests:
    - not_null
  - name: own_goal
    description: Indicates whether the goal was an own goal (TRUE) or not (FALSE).
    tests:
    - not_null
  - name: penalty
    description: Indicates whether the goal was a penalty kick (TRUE) or not (FALSE).
    tests:
    - not_null
  - name: _loaded_at
    description: Timestamp indicating when this record was loaded into the staging
      layer.
- name: stg_historical_shootouts
  description: Silver staging model for historical shootouts
  columns:
  - name: date
    description: The date of the shootout.
    tests:
    - not_null
  - name: home_team
    description: The name of the home team in lowercase.
    tests:
    - not_null
  - name: away_team
    description: The name of the away team in lowercase.
    tests:
    - not_null
  - name: winner
    description: The winner of the shootout in lowercase.
    tests:
    - not_null
  - name: first_shooter
    description: The first shooter in the shootout in lowercase.
  - name: _loaded_at
    description: Timestamp indicating when the record was loaded into the staging
      layer.
- name: stg_worldcup_api
  description: Silver staging model for worldcup api
  columns:
  - name: match_num
    description: The unique identifier for the match.
    tests:
    - not_null
    - unique
  - name: match_date
    description: The date when the match was played.
    tests:
    - not_null
  - name: match_time
    description: The time when the match started.
    tests:
    - not_null
  - name: round_name
    description: The name of the round in which the match took place.
    tests:
    - not_null
  - name: group_name
    description: The name of the group in which the match took place.
    tests:
    - not_null
  - name: ground
    description: The location where the match was held.
    tests:
    - not_null
  - name: team1_name
    description: The name of the first team participating in the match.
    tests:
    - not_null
  - name: team2_name
    description: The name of the second team participating in the match.
    tests:
    - not_null
  - name: score_ft_team1
    description: The final score of the first team.
    tests:
    - not_null
  - name: score_ft_team2
    description: The final score of the second team.
    tests:
    - not_null
  - name: score_ht_team1
    description: The half-time score of the first team.
    tests:
    - not_null
  - name: score_ht_team2
    description: The half-time score of the second team.
    tests:
    - not_null
  - name: _loaded_at
    description: Timestamp indicating when the record was loaded into the staging
      table.
- name: stg_worldcup_api_secondary
  description: Silver staging model for worldcup api secondary
  columns:
  - name: match_num
    description: The unique identifier for the match.
    tests:
    - not_null
  - name: match_date
    description: The date when the match took place.
    tests:
    - not_null
  - name: round_name
    description: The name of the round in which the match was played.
    tests:
    - not_null
  - name: team1_name
    description: The name of the first team participating in the match.
    tests:
    - not_null
  - name: team2_name
    description: The name of the second team participating in the match.
    tests:
    - not_null
  - name: scoring_team
    description: The name of the team that scored the goal.
    tests:
    - not_null
  - name: scorer_name
    description: The name of the player who scored the goal.
    tests:
    - not_null
  - name: minute
    description: The minute at which the goal was scored.
    tests:
    - not_null
  - name: is_team1_goal
    description: A boolean indicating whether the goal was scored by the first team.
    tests:
    - not_null
  - name: is_own_goal
    description: A boolean indicating whether the goal was an own goal.
    tests:
    - not_null
  - name: is_penalty
    description: A boolean indicating whether the goal was a penalty.
    tests:
    - not_null
  - name: _loaded_at
    description: The timestamp when this record was loaded into the staging table.
- name: stg_national_teams
  description: Silver staging model for national teams
  columns:
  - name: team_name
    description: The name of the national team.
    tests:
    - not_null
  - name: fifa_code
    description: The FIFA code assigned to the national team.
    tests:
    - not_null
    - unique
  - name: group_name
    description: The group or division in which the national team is categorized.
    tests:
    - not_null
  - name: _loaded_at
    description: Timestamp indicating when the record was loaded into the staging
      layer.
- name: stg_player_profiles
  description: Silver staging model for player profiles
  columns:
  - name: player_id
    description: Unique identifier for the player.
    tests:
    - not_null
    - unique
  - name: player_name
    description: Name of the player, converted to lowercase for consistency.
  - name: team_name
    description: Name of the team the player is associated with, converted to lowercase
      for consistency.
  - name: position
    description: Position played by the player, converted to lowercase for consistency.
  - name: jersey_number
    description: Number worn by the player on their jersey.
    tests:
    - not_null
  - name: club_name
    description: Name of the club the player is affiliated with, converted to lowercase
      for consistency.
  - name: club_country
    description: Country where the club is based, converted to lowercase for consistency.
  - name: date_of_birth
    description: Date when the player was born, cast to DATE format.
  - name: _loaded_at
    description: Timestamp indicating when this record was loaded into the staging
      layer.
