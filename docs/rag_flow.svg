<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">
  <rect width="900" height="620" fill="#f5f4f0"/>

  <text x="50" y="52" font-size="20" font-weight="600" fill="#1c1c1a" letter-spacing="0.2">query_agent — hybrid SQL + RAG flow</text>
  <text x="50" y="78" font-size="13" fill="#6b6b66">Natural-language question in, grounded answer out — routed to exactly one of two answer paths</text>

  <!-- question in -->
  <rect x="330" y="108" width="240" height="42" rx="4" fill="none" stroke="#b8b5ac" stroke-width="1"/>
  <text x="450" y="134" font-size="12" fill="#3a3a37" text-anchor="middle">natural-language question</text>

  <line x1="450" y1="150" x2="450" y2="176" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,176 445,166 455,166" fill="#a8a59c"/>

  <!-- intent classify -->
  <rect x="300" y="178" width="300" height="46" rx="4" fill="#ffffff" stroke="#8a6fd8" stroke-width="1.3"/>
  <text x="450" y="197" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">_classify_intent</text>
  <text x="450" y="214" font-size="10.5" fill="#6b6b66" text-anchor="middle">metadata · conversational · data</text>

  <line x1="450" y1="224" x2="450" y2="250" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,250 445,240 455,240" fill="#a8a59c"/>
  <text x="464" y="242" font-size="10" fill="#8a8780">data question</text>

  <!-- router -->
  <rect x="300" y="252" width="300" height="46" rx="4" fill="#ffffff" stroke="#8a6fd8" stroke-width="1.3"/>
  <text x="450" y="271" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">_classify_structured_or_unstructured</text>
  <text x="450" y="288" font-size="10.5" fill="#6b6b66" text-anchor="middle">router — decides answer path</text>

  <!-- branch -->
  <line x1="450" y1="298" x2="450" y2="316" stroke="#a8a59c" stroke-width="1.2"/>
  <line x1="450" y1="316" x2="240" y2="340" stroke="#c4633f" stroke-width="1.3"/>
  <polygon points="236,347 242,336 248,343" fill="#c4633f"/>
  <line x1="450" y1="316" x2="660" y2="340" stroke="#3d7a8f" stroke-width="1.3"/>
  <polygon points="664,347 658,336 652,343" fill="#3d7a8f"/>

  <text x="300" y="332" font-size="10" fill="#8a8780">structured</text>
  <text x="600" y="332" font-size="10" fill="#8a8780">unstructured</text>

  <!-- LEFT: structured path -->
  <rect x="80" y="350" width="340" height="50" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="250" y="370" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">_retrieve_relevant_tables</text>
  <text x="250" y="386" font-size="10" fill="#6b6b66" text-anchor="middle">ChromaDB · gold_schema collection · top-2 tables</text>

  <line x1="250" y1="400" x2="250" y2="420" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="250,420 245,410 255,410" fill="#a8a59c"/>

  <rect x="80" y="422" width="340" height="50" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="250" y="442" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">_get_categorical_context</text>
  <text x="250" y="458" font-size="10" fill="#6b6b66" text-anchor="middle">real distinct values, fuzzy-matched to the question</text>

  <line x1="250" y1="472" x2="250" y2="492" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="250,492 245,482 255,482" fill="#a8a59c"/>

  <rect x="80" y="494" width="340" height="50" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="250" y="514" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">generate_sql → sqlglot validate → DuckDB</text>
  <text x="250" y="530" font-size="10" fill="#6b6b66" text-anchor="middle">AST-parsed, GOLD-schema-only, retry loop on failure</text>

  <!-- RIGHT: unstructured path -->
  <rect x="480" y="350" width="340" height="50" rx="4" fill="#ffffff" stroke="#3d7a8f" stroke-width="1.3"/>
  <text x="650" y="370" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">_answer_unstructured</text>
  <text x="650" y="386" font-size="10" fill="#6b6b66" text-anchor="middle">ChromaDB · unstructured_content collection</text>

  <line x1="650" y1="400" x2="650" y2="420" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="650,420 645,410 655,410" fill="#a8a59c"/>

  <rect x="480" y="422" width="340" height="50" rx="4" fill="#ffffff" stroke="#3d7a8f" stroke-width="1.3"/>
  <text x="650" y="442" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">retrieve top-2 Wikipedia articles</text>
  <text x="650" y="458" font-size="10" fill="#6b6b66" text-anchor="middle">real team summaries, embedded once</text>

  <line x1="650" y1="472" x2="650" y2="492" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="650,492 645,482 655,482" fill="#a8a59c"/>

  <rect x="480" y="494" width="340" height="50" rx="4" fill="#ffffff" stroke="#3d7a8f" stroke-width="1.3"/>
  <text x="650" y="514" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">answer directly from retrieved text</text>
  <text x="650" y="530" font-size="10" fill="#6b6b66" text-anchor="middle">no SQL — refuses honestly if context is insufficient</text>

  <!-- converge -->
  <line x1="250" y1="544" x2="250" y2="562" stroke="#a8a59c" stroke-width="1.2"/>
  <line x1="650" y1="544" x2="650" y2="562" stroke="#a8a59c" stroke-width="1.2"/>
  <line x1="250" y1="562" x2="450" y2="580" stroke="#a8a59c" stroke-width="1.2"/>
  <line x1="650" y1="562" x2="450" y2="580" stroke="#a8a59c" stroke-width="1.2"/>

  <rect x="330" y="582" width="240" height="30" rx="4" fill="#f0efe9" stroke="#b8b5ac" stroke-width="1"/>
  <text x="450" y="601" font-size="11.5" fill="#3a3a37" text-anchor="middle">answer returned to user</text>
</svg>
