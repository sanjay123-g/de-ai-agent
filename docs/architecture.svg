<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="700" fill="#ffffff"/>
  <rect x="330" y="20" width="240" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Source</text>
  <text x="450" y="65" text-anchor="middle" font-size="12" fill="#444">CSV / SQLite / REST API</text>
  <line x1="450" y1="80" x2="450" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="110" width="300" height="55" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
  <text x="450" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">schema_agent</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#444">infers types + nullability from real data</text>
  <line x1="450" y1="165" x2="450" y2="195" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="195" width="300" height="55" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
  <text x="450" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ddl_agent</text>
  <text x="450" y="235" text-anchor="middle" font-size="11" fill="#444">generates + executes CREATE TABLE in Snowflake</text>
  <line x1="450" y1="250" x2="450" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="280" width="360" height="70" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
  <text x="450" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ingest_agent</text>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#444">validates rows, writes to Bronze, dead-letters</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#444">failures, updates watermark, checks SLOs</text>
  <line x1="450" y1="350" x2="450" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="380" width="360" height="70" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
  <text x="450" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">transform_agent</text>
  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#444">generates dbt staging model + schema.yml</text>
  <text x="450" y="436" text-anchor="middle" font-size="11" fill="#444">with data-driven test suggestions</text>
  <line x1="450" y1="450" x2="450" y2="480" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="480" width="300" height="55" rx="8" fill="#fff4e5" stroke="#e8710a" stroke-width="2"/>
  <text x="450" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">qa_agent</text>
  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#444">dbt compile → dbt run → dbt test</text>
  <line x1="450" y1="535" x2="450" y2="565" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="565" width="200" height="50" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="280" y="595" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">done</text>
  <rect x="520" y="565" width="200" height="50" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="620" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">failure_node</text>
  <text x="620" y="605" text-anchor="middle" font-size="10" fill="#444">Slack alert</text>
  <line x1="400" y1="590" x2="380" y2="590" stroke="#34a853" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="500" y1="590" x2="520" y2="590" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="640" y="110" width="220" height="120" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="750" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">supervisor.py</text>
  <text x="750" y="150" text-anchor="middle" font-size="10" fill="#444">Deterministic routing —</text>
  <text x="750" y="164" text-anchor="middle" font-size="10" fill="#444">reads state after each</text>
  <text x="750" y="178" text-anchor="middle" font-size="10" fill="#444">node, decides next hop.</text>
  <text x="750" y="192" text-anchor="middle" font-size="10" fill="#444">Retries live inside each</text>
  <text x="750" y="206" text-anchor="middle" font-size="10" fill="#444">agent (tenacity), not the</text>
  <text x="750" y="220" text-anchor="middle" font-size="10" fill="#444">graph itself.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#34a853"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ea4335"/></marker>
  </defs>
</svg>
