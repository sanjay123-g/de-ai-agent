<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">
  <rect width="900" height="760" fill="#f5f4f0"/>

  <text x="50" y="52" font-size="20" font-weight="600" fill="#1c1c1a" letter-spacing="0.2">de-ai-agent — pipeline architecture</text>
  <text x="50" y="78" font-size="13" fill="#6b6b66">One LangGraph run per source · agents execute in strict sequence · routing is deterministic, not LLM-decided</text>

  <!-- SOURCE -->
  <rect x="290" y="112" width="320" height="46" rx="4" fill="none" stroke="#b8b5ac" stroke-width="1"/>
  <text x="450" y="140" font-size="12.5" fill="#3a3a37" text-anchor="middle">source · csv · sqlite · rest api</text>

  <line x1="450" y1="158" x2="450" y2="188" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,188 445,178 455,178" fill="#a8a59c"/>

  <!-- schema_agent -->
  <rect x="250" y="190" width="400" height="50" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="450" y="212" font-size="13" font-weight="600" fill="#1c1c1a" text-anchor="middle">schema_agent</text>
  <text x="450" y="230" font-size="11" fill="#6b6b66" text-anchor="middle">infers column types + nullability from real sampled data</text>

  <line x1="450" y1="240" x2="450" y2="270" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,270 445,260 455,260" fill="#a8a59c"/>

  <!-- ddl_agent -->
  <rect x="250" y="272" width="400" height="50" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="450" y="294" font-size="13" font-weight="600" fill="#1c1c1a" text-anchor="middle">ddl_agent</text>
  <text x="450" y="312" font-size="11" fill="#6b6b66" text-anchor="middle">generates + executes CREATE TABLE against DuckDB</text>

  <line x1="450" y1="322" x2="450" y2="352" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,352 445,342 455,342" fill="#a8a59c"/>

  <!-- ingest_agent -->
  <rect x="250" y="354" width="400" height="64" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="450" y="376" font-size="13" font-weight="600" fill="#1c1c1a" text-anchor="middle">ingest_agent</text>
  <text x="450" y="394" font-size="11" fill="#6b6b66" text-anchor="middle">validates rows · writes Bronze · dead-letters failures</text>
  <text x="450" y="409" font-size="11" fill="#6b6b66" text-anchor="middle">updates watermark · checks SLOs</text>

  <line x1="450" y1="418" x2="450" y2="448" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,448 445,438 455,438" fill="#a8a59c"/>

  <!-- transform_agent -->
  <rect x="250" y="450" width="400" height="58" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="450" y="472" font-size="13" font-weight="600" fill="#1c1c1a" text-anchor="middle">transform_agent</text>
  <text x="450" y="490" font-size="11" fill="#6b6b66" text-anchor="middle">generates dbt staging model + schema.yml with</text>
  <text x="450" y="503" font-size="11" fill="#6b6b66" text-anchor="middle">data-driven test suggestions</text>

  <line x1="450" y1="508" x2="450" y2="538" stroke="#a8a59c" stroke-width="1.2"/>
  <polygon points="450,538 445,528 455,528" fill="#a8a59c"/>

  <!-- qa_agent -->
  <rect x="250" y="540" width="400" height="50" rx="4" fill="#ffffff" stroke="#c4633f" stroke-width="1.3"/>
  <text x="450" y="562" font-size="13" font-weight="600" fill="#1c1c1a" text-anchor="middle">qa_agent</text>
  <text x="450" y="580" font-size="11" fill="#6b6b66" text-anchor="middle">dbt compile → dbt run → dbt test</text>

  <!-- Branch -->
  <line x1="450" y1="590" x2="450" y2="614" stroke="#a8a59c" stroke-width="1.2"/>
  <line x1="450" y1="614" x2="360" y2="640" stroke="#3d8f63" stroke-width="1.3"/>
  <polygon points="356,648 362,636 368,644" fill="#3d8f63"/>
  <line x1="450" y1="614" x2="540" y2="640" stroke="#b8493e" stroke-width="1.3"/>
  <polygon points="544,648 538,636 532,644" fill="#b8493e"/>

  <rect x="280" y="650" width="160" height="40" rx="4" fill="none" stroke="#3d8f63" stroke-width="1.2"/>
  <text x="360" y="675" font-size="12" font-weight="600" fill="#2c6b48" text-anchor="middle">done</text>

  <rect x="460" y="650" width="160" height="40" rx="4" fill="none" stroke="#b8493e" stroke-width="1.2"/>
  <text x="540" y="670" font-size="12" font-weight="600" fill="#8a352c" text-anchor="middle">failure_node</text>
  <text x="540" y="684" font-size="9.5" fill="#8a352c" text-anchor="middle">slack alert</text>

  <!-- footer -->
  <line x1="50" y1="716" x2="850" y2="716" stroke="#d8d5cc" stroke-width="1"/>
  <text x="50" y="738" font-size="10.5" fill="#8a8780">supervisor.py routes deterministically off state["status"] after each node — the graph itself stays acyclic; retries live inside each agent (tenacity).</text>
  <text x="50" y="754" font-size="10.5" fill="#8a8780">sql_guardrails.py validates every generated query via sqlglot AST parsing — not regex — before it ever executes, and restricts access to the GOLD schema only.</text>
</svg>
