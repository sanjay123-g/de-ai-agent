<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="780" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="45" font-size="20" font-weight="700" fill="#0f172a">de-ai-agent — Pipeline Architecture</text>
  <text x="40" y="66" font-size="12.5" fill="#64748b">One LangGraph run per source · agents in sequence · deterministic routing</text>
  <line x1="40" y1="82" x2="960" y2="82" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Source -->
  <rect x="370" y="112" width="260" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">SOURCE</text>
  <text x="500" y="154" text-anchor="middle" font-size="11.5" fill="#475569">CSV · SQLite · REST API</text>

  <line x1="500" y1="170" x2="500" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent stack -->
  <g>
    <rect x="330" y="196" width="340" height="60" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="330" y="196" width="6" height="60" rx="3" fill="#f97316"/>
    <text x="356" y="221" font-size="13.5" font-weight="700" fill="#0f172a">schema_agent</text>
    <text x="356" y="240" font-size="11.5" fill="#64748b">Infers column types + nullability from real data</text>
  </g>

  <line x1="500" y1="256" x2="500" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="330" y="282" width="340" height="60" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="330" y="282" width="6" height="60" rx="3" fill="#f97316"/>
    <text x="356" y="307" font-size="13.5" font-weight="700" fill="#0f172a">ddl_agent</text>
    <text x="356" y="326" font-size="11.5" fill="#64748b">Generates + executes CREATE TABLE in Snowflake</text>
  </g>

  <line x1="500" y1="342" x2="500" y2="368" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="300" y="368" width="400" height="74" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="300" y="368" width="6" height="74" rx="3" fill="#f97316"/>
    <text x="326" y="394" font-size="13.5" font-weight="700" fill="#0f172a">ingest_agent</text>
    <text x="326" y="413" font-size="11.5" fill="#64748b">Validates rows · writes to Bronze · routes failures</text>
    <text x="326" y="430" font-size="11.5" fill="#64748b">to dead-letter · updates watermark · checks SLOs</text>
  </g>

  <line x1="500" y1="442" x2="500" y2="468" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="300" y="468" width="400" height="74" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="300" y="468" width="6" height="74" rx="3" fill="#f97316"/>
    <text x="326" y="494" font-size="13.5" font-weight="700" fill="#0f172a">transform_agent</text>
    <text x="326" y="513" font-size="11.5" fill="#64748b">Generates dbt staging model + schema.yml with</text>
    <text x="326" y="530" font-size="11.5" fill="#64748b">data-driven test suggestions</text>
  </g>

  <line x1="500" y1="542" x2="500" y2="568" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="330" y="568" width="340" height="60" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="330" y="568" width="6" height="60" rx="3" fill="#f97316"/>
    <text x="356" y="593" font-size="13.5" font-weight="700" fill="#0f172a">qa_agent</text>
    <text x="356" y="612" font-size="11.5" fill="#64748b">dbt compile → dbt run → dbt test</text>
  </g>

  <line x1="500" y1="628" x2="500" y2="654" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="654" x2="400" y2="680" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="500" y1="654" x2="600" y2="680" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowr)"/>

  <!-- Terminal nodes -->
  <rect x="240" y="684" width="180" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="715" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">done</text>

  <rect x="580" y="684" width="180" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="708" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">failure_node</text>
  <text x="670" y="724" text-anchor="middle" font-size="10.5" fill="#991b1b">Slack alert</text>

  <!-- Supervisor sidebar note -->
  <rect x="730" y="196" width="230" height="146" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" filter="url(#shadow)"/>
  <text x="750" y="222" font-size="13" font-weight="700" fill="#581c87">supervisor.py</text>
  <text x="750" y="244" font-size="11" fill="#6b21a8">Deterministic routing logic —</text>
  <text x="750" y="260" font-size="11" fill="#6b21a8">reads state["status"] after each</text>
  <text x="750" y="276" font-size="11" fill="#6b21a8">node and decides the next hop.</text>
  <text x="750" y="298" font-size="11" fill="#6b21a8">Retries live inside each agent</text>
  <text x="750" y="314" font-size="11" fill="#6b21a8">(tenacity) — the graph itself</text>
  <text x="750" y="330" font-size="11" fill="#6b21a8">stays acyclic.</text>

  <!-- Legend -->
  <text x="40" y="760" font-size="10.5" fill="#94a3b8">6 sources run through this graph independently — one full state per invocation, no shared mutation between runs.</text>
</svg>
